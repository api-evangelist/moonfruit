  url: https://moonfruit.com/wp-json/
  status: 200
  content_type: application/json
  detail: >-
    moonfruit.com runs WordPress. The stock WP REST API answers anonymously with a
    393-route index across 27 namespaces, all of them WordPress core or third-party
    plugins (wp/v2, oembed/1.0, akismet/v1, rankmath/v1, wordfence/v1, astra/v1,
