    cleantalk-antispam/v1, nps-survey/v1, wp-abilities/v1, mcp). No first-party
    MoonFruit namespace exists. NOT registered as a MoonFruit API: this contract
    belongs to WordPress and its plugin authors, not to this company, and crediting
    it would credit MoonFruit with an API it never shipped.
- surface: WordPress MCP Adapter endpoint
  url: https://moonfruit.com/wp-json/mcp/mcp-adapter-default-server
  status: 401
  detail: >-
    A POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"} returns
    {"code":"rest_forbidden","status":401}. The endpoint is the default server of
