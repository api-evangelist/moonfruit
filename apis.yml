  detail: >-
    MoonFruit is a WordPress-hosted directory of digital marketing agencies with no
    developer program of any kind: api., developer. and docs.moonfruit.com are wildcard
    DNS records that return the 236KB marketing homepage with HTTP 200, every
    /.well-known/ path 404s, and the only machine-readable surface on the domain is the
    stock WordPress REST API at /wp-json/ (WordPress core and third-party plugin
    namespaces only, no first-party MoonFruit namespace, with the bundled MCP Adapter
    endpoint returning rest_forbidden 401).
