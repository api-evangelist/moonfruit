name: MoonFruit
description: MoonFruit is a directory platform that connects businesses with vetted
  digital marketing agencies worldwide, letting users search and filter agencies by
  service specialization (SEO, PPC, content marketing, web design, branding, video
  production and more) and by geographic location across major US cities and international
  markets such as London and Dubai. Each listing surfaces agency details including
  location, budget ranges and service descriptions, and agencies can submit or claim
  their own profiles. The company was surfaced as a portfolio company of 500 Global
  and added to the API Evangelist network for enrichment; as of this pass the live
  site publishes no public API, developer portal, or programmatic surface.
